<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoStore | Cyber Shopping</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto+Mono:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --cyber-bg: #0a0a0a;
            --neon-cyan: #00ffff;
            --neon-pink: #ff00ff;
            --neon-blue: #0066ff;
            --gold-glow: #ffd700;
            --glass-dark: rgba(255,255,255,0.05);
            --scanline-glow: 0 0 20px rgba(0,255,255,0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--cyber-bg); color: #fff; font-family: 'Roboto Mono', monospace;
            overflow-x: hidden; position: relative;
        }

        /* Matrix Rain Effect */
        canvas { position: fixed; top: 0; left: 0; z-index: 1; }

        /* Glitch Header */
        .glitch {
            position: relative; font-family: 'Orbitron', monospace; font-weight: 900;
            animation: glitch 2s infinite;
        }
        .glitch::before, .glitch::after {
            content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }
        .glitch::before { animation: glitch-anim-1 2s infinite; color: var(--neon-cyan); }
        .glitch::after { animation: glitch-anim-2 2s infinite; color: var(--neon-pink); }

        /* Splash Screen */
        #splash {
            position: fixed; inset: 0; background: #000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10000;
        }
        #splash h1 {
            font-size: clamp(4rem, 15vw, 8rem); color: var(--neon-cyan);
            text-shadow: var(--scanline-glow), 0 0 40px var(--neon-cyan);
            animation: flicker 1.5s infinite alternate;
        }
        .loading-bar {
            width: 300px; height: 8px; background: rgba(255,255,255,0.1); margin-top: 3rem;
            border-radius: 4px; overflow: hidden; box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .loading-progress {
            height: 100%; background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
            width: 0%; animation: load 3s ease-out forwards; box-shadow: var(--scanline-glow);
        }

        /* Main Layout */
        .page { 
            min-height: 100vh; padding: 80px 40px; display: none; position: relative; z-index: 10;
        }
        .page.active { display: block; animation: scanIn 1s ease-out; }

        .container { max-width: 1400px; margin: 0 auto; }

        /* Header */
        header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 60px;
            background: var(--glass-dark); backdrop-filter: blur(20px); padding: 20px 40px;
            border: 1px solid rgba(0,255,255,0.3); border-radius: 12px; box-shadow: var(--scanline-glow);
        }
        .title-glitch {
            font-size: 2.5rem; margin: 0;
        }
        .cart-holo {
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-pink)); padding: 15px 25px;
            border-radius: 25px; font-weight: 700; cursor: pointer; position: relative;
            box-shadow: 0 0 25px var(--neon-cyan);
        }
        .cart-count {
            background: var(--neon-pink); color: #000; border-radius: 50%; width: 35px; height: 35px;
            display: inline-flex; align-items: center; justify-content: center; margin-left: 10px;
            font-weight: 900; box-shadow: 0 0 15px var(--neon-pink); animation: pulseHolo 1.5s infinite;
        }

        /* Product Grid */
        .products {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 40px;
        }
        .product-holo {
            background: var(--glass-dark); border: 1px solid rgba(0,255,255,0.2);
            border-radius: 20px; padding: 30px; text-align: center; cursor: pointer;
            transition: all 0.4s ease; position: relative; overflow: hidden;
        }
        .product-holo::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink), var(--neon-blue));
            transform: scaleX(0); transition: transform 0.4s ease;
        }
        .product-holo:hover::before { transform: scaleX(1); }
        .product-holo:hover {
            transform: translateY(-15px) scale(1.02); border-color: var(--neon-cyan);
            box-shadow: 0 30px 60px rgba(0,255,255,0.3), inset 0 0 30px rgba(0,255,255,0.1);
        }
        .product-img {
            width: 100%; height: 280px; object-fit: cover; border-radius: 16px; margin-bottom: 20px;
            filter: drop-shadow(0 10px 30px rgba(0,255,255,0.3)); transition: all 0.4s ease;
        }
        .product-holo:hover .product-img { filter: drop-shadow(0 20px 40px rgba(0,255,255,0.5)); }
        .product-name {
            font-size: 1.5rem; font-weight: 700; margin-bottom: 20px; color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
        }
        .buy-btn {
            width: 100%; padding: 15px; background: linear-gradient(45deg, var(--neon-cyan), var(--neon-pink));
            border: none; border-radius: 12px; color: #000; font-weight: 700; font-size: 1.1rem;
            cursor: pointer; transition: all 0.3s ease; box-shadow: 0 10px 30px rgba(0,255,255,0.4);
        }
        .buy-btn:hover { transform: scale(1.05); box-shadow: 0 15px 40px rgba(0,255,255,0.6); }

        /* Modal */
        #modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000;
            display: none; justify-content: center; align-items: center;
        }
        #modal.active { display: flex; animation: modalSlide 0.5s ease; }
        .modal-box {
            background: var(--glass-dark); border: 2px solid var(--neon-cyan); border-radius: 20px;
            padding: 40px; text-align: center; max-width: 450px; width: 90%;
            box-shadow: 0 0 50px var(--neon-cyan);
        }
        .modal-icon { font-size: 4rem; color: var(--neon-pink); margin-bottom: 20px; }
        .modal-title { font-size: 2rem; margin-bottom: 15px; color: var(--neon-cyan); }

        /* Animations */
        @keyframes glitch {
            0%, 100% { clip: rect(42px, 9999px, 56px, 0); transform: skew(0.3deg); }
            5% { clip: rect(17px, 9999px, 35px, 0); transform: skew(0.6deg); }
