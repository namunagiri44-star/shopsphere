<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSphere | E-commerce</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. Splash Screen -->
    <div id="splash">
        <h1>ShopSphere</h1>
    </div>

    <!-- 2. Start Screen -->
    <div id="start-screen">
        <button onclick="startShopping()">Start Shopping</button>
    </div>

    <!-- 3. Home Page -->
    <div id="home-page" class="page">
        <header>
            <h2>Welcome to ShopSphere</h2>
            <div id="cart">Cart: <span id="cart-count">0</span></div>
        </header>

        <section id="featured-products">
            <h3>Featured Products</h3>
            <div class="products">
                <div class="product">
                    <img src="https://via.placeholder.com/150" alt="Product 1">
                    <p>Product 1</p>
                    <button onclick="addCart()">Add to Quote</button>
                </div>
                <div class="product">
                    <img src="https://via.placeholder.com/150" alt="Product 2">
                    <p>Product 2</p>
                    <button onclick="addCart()">Add to Quote</button>
                </div>
                <div class="product">
                    <img src="https://via.placeholder.com/150" alt="Product 3">
                    <p>Product 3</p>
                    <button onclick="addCart()">Add to Quote</button>
                </div>
            </div>
        </section>

        <button onclick="openPage('shop-page')">Go to Shop</button>
    </div>

    <!-- 4. Shop Page -->
    <div id="shop-page" class="page">
        <header>
            <h2>Shop Page</h2>
            <button onclick="openPage('home-page')">Back Home</button>
        </header>
        <section class="products">
            <div class="product">
                <img src="https://via.placeholder.com/150" alt="Product A">
                <p>Product A</p>
                <button onclick="addCart()">Add to Quote</button>
            </div>
            <div class="product">
                <img src="https://via.placeholder.com/150" alt="Product B">
                <p>Product B</p>
                <button onclick="addCart()">Add to Quote</button>
            </div>
        </section>
    </div>

    <!-- 5. Promo Modal -->
    <div id="promoModal">
        <div class="modal-content">
            <h3>Special Offer!</h3>
            <p>Get 10% off your first order.</p>
            <button onclick="closeModal()">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
