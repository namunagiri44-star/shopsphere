<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSphere | Premium E-commerce</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. Splash Screen -->
    <div id="splash">
        <img src="https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=500&h=500&fit=crop&crop=center" 
             alt="ShopSphere - Premium Shopping Experience" 
             loading="eager">
    </div>

    <!-- 2. Start Screen (Hero) -->
    <div id="start-screen">
        <div class="hero-content">
            <h1>ShopSphere</h1>
            <p class="hero-subtitle">Discover Premium Products</p>
            <button class="cta-button" onclick="startShopping()">
                🚀 Start Shopping
            </button>
        </div>
    </div>

    <!-- 3. Home Page -->
    <div id="home-page" class="page">
        <div class="container">
            <header>
                <h2 class="page-title">Welcome to ShopSphere</h2>
                <div class="cart-badge" onclick="toggleCartView()">
                    <span>Quote:</span>
                    <span id="cart-count">0</span>
                </div>
            </header>

            <section id="featured-products">
                <h3 class="section-title">✨ Featured Products</h3>
                <div class="products">
                    <div class="product-card">
                        <img src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400&h=400&fit=crop&crop=center" 
                             alt="Premium Leather Handbag" class="product-image" loading="lazy">
                        <h3 class="product-title">Premium Leather Bag</h3>
                        <button class="add-to-cart-btn" onclick="addCart()">Add to Quote</button>
                    </div>
                    
                    <div class="product-card">
                        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&h=400&fit=crop&crop=center" 
                             alt="Professional Running Shoes" class="product-image" loading="lazy">
                        <h3 class="product-title">Pro Running Shoes</h3>
                        <button class="add-to-cart-btn" onclick="addCart()">Add to Quote</button>
                    </div>
                    
                    <div class="product-card">
                        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&h=400&fit=crop&crop=center" 
                             alt="Smart Fitness Watch" class="product-image" loading="lazy">
                        <h3 class="product-title">Smart Watch</h3>
                        <button class="add-to-cart-btn" onclick="addCart()">Add to Quote</button>
                    </div>
                </div>
            </section>

            <div style="text-align: center; margin-top: 3rem;">
                <button class="cta-button" onclick="openPage('shop-page')" style="max-width: 300px;">
                    🛒 Explore Full Shop
                </button>
            </div>
        </div>
    </div>

    <!-- 4. Shop Page -->
    <div id="shop-page" class="page">
        <div class="container">
            <header>
                <h2 class="page-title">Full Collection</h2>
                <button class="back-btn" onclick="openPage('home-page')">
                    ← Back to Home
                </button>
            </header>

            <section class="products">
                <div class="product-card">
                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400&h=400&fit=crop&crop=center" 
                         alt="Wireless Noise-Cancelling Headphones" class="product-image" loading="lazy">
                    <h3 class="product-title">Wireless Headphones</h3>
                    <button class="add-to-cart-btn" onclick="addCart()">Add to Quote</button>
                </div>

                <div class="product-card">
                    <img src="https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=400&h=400&fit=crop&crop=center" 
                         alt="Designer Sunglasses" class="product-image" loading="lazy">
                    <h3 class="product-title">Designer Sunglasses</h3>
                    <button class="add-to-cart-btn" onclick="addCart()">Add to Quote</button>
                </div>

                <div class="product-card">
                    <img src="https://images.unsplash.com/photo-1581655353564-df123a1eb820?w=400&h=400&fit=crop&crop=center" 
                         alt="Wireless Earbuds" class="product-image" loading="lazy">
                    <h3 class="product-title">Wireless Earbuds</h3>
                    <button class="add-to-cart-btn" onclick="addCart()">Add to Quote</button>
                </div>

                <div class="product-card">
                    <img src="https://images.unsplash.com/photo-1608145402667-6c2a4947e6a6?w=400&h=400&fit=crop&crop=center" 
                         alt="Premium Smartphone Case" class="product-image" loading="lazy">
                    <h3 class="product-title">Phone Case</h3>
                    <button class="add-to-cart-btn" onclick="addCart()">Add to Quote</button>
                </div>
            </section>
        </div>
    </div>

    <!-- 5. Promo Modal -->
    <div id="promoModal">
        <div class="modal-content">
            <img src="https://images.unsplash.com/photo-1571115628310-6eabf7bf9e21?w=200&h=200&fit=crop&crop=center" 
                 alt="Special Offer" loading="lazy">
            <h3 class="modal-title">🎉 Launch Special!</h3>
            <p>Get <strong>15% OFF</strong> first order<br>
               Use code: <code>LAUNCH15</code></p>
            <button class="cta-button" onclick="closeModal()" style="width: 100%; margin-top: 1rem;">
                Claim Offer 🎁
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
