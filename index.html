<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSphere | Luxury Shopping Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            --glass-bg: rgba(255,255,255,0.1);
            --glass-border: rgba(255,255,255,0.2);
            --neon-glow: #00d4ff;
            --gold: #ffd700;
            --shadow-neon: 0 0 30px rgba(0,212,255,0.3);
            --radius: 24px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif; background: var(--bg-gradient);
            color: white; overflow-x: hidden; min-height: 100vh;
        }

        /* Particles Background */
        #particles {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at 20% 80%, rgba(120,119,198,0.3) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(255,119,198,0.3) 0%, transparent 50%);
            animation: bgShift 15s ease infinite;
        }

        /* Splash Screen */
        #splash {
            position: fixed; inset: 0; background: var(--bg-gradient);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10000; backdrop-filter: blur(20px);
        }
        #splash::after {
            content: 'Loading...'; font-size: 1.2rem; margin-top: 2rem;
            animation: pulseGlow 2s infinite; color: var(--neon-glow);
        }
        #splash img {
            width: clamp(200px, 30vw, 300px); border-radius: var(--radius);
            box-shadow: var(--shadow-neon), 0 0 60px rgba(0,212,255,0.5);
            animation: float3d 4s ease-in-out infinite;
        }

        /* Hero Section */
        #start-screen {
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            position: relative; overflow: hidden;
        }
        .hero-content {
            text-align: center; background: var(--glass-bg); backdrop-filter: blur(30px);
            padding: 4rem 3rem; border-radius: var(--radius); border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-neon);
        }
        .hero-title {
            font-size: clamp(4rem, 10vw, 7rem); font-weight: 800; margin-bottom: 1rem;
            background: linear-gradient(45deg, var(--gold), var(--neon-glow), #ff6b9d);
            background-size: 300% 300%; animation: gradientShift 3s ease infinite;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .hero-subtitle {
            font-size: 1.5rem; opacity: 0.9; margin-bottom: 3rem; font-weight: 500;
        }
        .cta-hero {
            padding: 1.5rem 4rem; font-size: 1.4rem; font-weight: 700; border: none;
            border-radius: var(--radius); cursor: pointer; background: linear-gradient(45deg, var(--gold), #ffed4a);
            color: #1a1a2e; box-shadow: 0 15px 35px rgba(255,215,0,0.4);
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative; overflow: hidden;
        }
        .cta-hero:hover {
            transform: translateY(-15px) scale(1.05); box-shadow: 0 25px 50px rgba(255,215,0,0.6);
        }
        .cta-hero::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.7s;
        }
        .cta-hero:hover::before { left: 100%; }

        /* Pages */
        .page { display: none; min-height: 100vh; padding: 60px 20px; }
        .page.active { display: block; animation: slideInUp 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        
        .container { max-width: 1400px; margin: 0 auto; }
        header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 4rem;
            background: var(--glass-bg); backdrop-filter: blur(20px); padding: 2rem;
            border-radius: var(--radius); border: 1px solid var(--glass-border);
        }
        .page-title {
            font-size: clamp(2.5rem, 6vw, 4rem); font-weight: 800;
            background: linear-gradient(45deg, var(--gold), var(--neon-glow));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .cart-badge {
            background: linear-gradient(45deg, var(--neon-glow), #00d4ff); padding: 1.2rem 2rem;
            border-radius: var(--radius); font-weight: 700; cursor: pointer; position: relative;
            box-shadow: var(--shadow-neon);
        }
        .cart-badge:hover { transform: scale(1.05); }
        #cart-count {
            background: var(--gold); color: #1a1a2e; border-radius: 50%; width: 35px; height: 35px;
            display: inline-flex; align-items: center; justify-content: center; font-weight: 800;
            margin-left: 0.8rem; box-shadow: 0 0 20px rgba(255,215,0,0.8); animation: bounce 2s infinite;
        }

        /* Product Grid */
        .products {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2.5rem;
        }
        .product-card {
            background: var(--glass-bg); backdrop-filter: blur(30px); border-radius: var(--radius);
            padding: 2.5rem 2rem; text-align: center; border: 1px solid var(--glass-border);
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55); position: relative;
            overflow: hidden;
        }
        .product-card::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg); transition: all 0.6s;
        }
        .product-card:hover::before { transform: rotate(45deg) translateX(100%) translateY(100%); }
        .product-card:hover {
            transform: translateY(-20px) rotateX(5deg) rotateY(5deg); border-color: var(--neon-glow);
            box-shadow: var(--shadow-neon), 0 30px 60px rgba(0,0,0,0.3);
        }
        .product-image {
            width: 100%; height: 250px; object-fit: cover; border-radius: 20px; margin-bottom: 1.5rem;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); transition: all 0.5s ease;
        }
        .product-card:hover .product-image { transform: scale(1.1) rotate(3deg); }
        .product-title {
            font-size: 1.6rem; font-weight: 700; margin-bottom: 1.5rem;
            background: linear-gradient(45deg, var(--gold), var(--neon-glow));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .add-to-cart {
            width: 100%; padding: 1.2rem; font-size: 1.1rem; font-weight: 700; border: none;
            border-radius: 16px; cursor: pointer; background: linear-gradient(45deg, var(--gold), #ffed4a);
            color: #1a1a2e; box-shadow: 0 10px 30px rgba(255,215,0,0.4); transition: all 0.4s ease;
            position: relative; overflow: hidden;
        }
        .add-to-cart:hover {
            transform: translateY(-5px) scale(1.02); box-shadow: 0 20px 40px rgba(255,215,0,0.6);
        }

        /* Modal */
        #promoModal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            backdrop-filter: blur(15px); z-index: 9999; justify-content: center; align-items: center;
        }
        #promoModal.show { display: flex; animation: modalAppear 0.5s ease; }
        .modal-content {
            background: var(--glass-bg); backdrop-filter: blur(40px); border-radius: var(--radius);
            border: 1px solid var(--glass-border); padding: 3.5rem 3rem; text-align: center;
            max-width: 500px; width: 90%; box-shadow: var(--shadow-neon);
        }
        .modal-icon { font-size: 4rem; margin-bottom: 1.5rem; color: var(--gold); }
        .modal-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 1rem; }

        /* Responsive */
        @media (max-width: 768px) {
            .products { grid-template-columns: 1fr; gap: 2rem; }
            header { flex-direction: column; gap: 2rem; text-align: center; }
            .hero-content { padding: 2.5rem 2rem; }
        }

        /* Animations */
        @keyframes float3d {
            0%, 100% { transform: translateY(0px) rotateX(0deg); }
            50% { transform: translateY(-25px) rotateX(10deg); }
        }
        @keyframes pulseGlow { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
        @keyframes bgShift { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(180deg); } }
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        @keyframes bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
        @keyframes slideInUp { from { opacity: 0; transform: translateY(50px); } }
        @keyframes modalAppear { from { opacity: 0; transform: scale(0.8); } }
    </style>
</head>

        const buttons = document.querySelectorAll('.add-to-cart');
